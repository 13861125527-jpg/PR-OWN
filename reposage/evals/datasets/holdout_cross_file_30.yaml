name: holdout-cross-file-30
samples:
- id: holdout-01-decimal-money
  kind: cross_file
  pr_title: Refine decimal money handling
  pr_description: Simplify the transformation while preserving externally observable
    behavior.
  base_files:
    app/review_01.py: "from contracts.rule_01 import apply\n\ndef transform(value):\n\
      \    return str(apply(value))\n"
    contracts/rule_01.py: "from decimal import Decimal\ndef apply(value):\n    return\
      \ Decimal(value).quantize(Decimal('0.01'))\n"
    contracts/common.py: 'DEFAULT_LIMIT = 100

      '
  head_files:
    app/review_01.py: "from contracts.rule_01 import apply\n\ndef transform(value):\n\
      \    return str(float(apply(value)))\n"
    contracts/rule_01.py: "from decimal import Decimal\ndef apply(value):\n    return\
      \ Decimal(value).quantize(Decimal('0.01'))\n"
    contracts/common.py: 'DEFAULT_LIMIT = 100

      '
  expected:
  - category: correctness
    path: app/review_01.py
    line: 4
    severity: medium
    note: Converting the normalized Decimal through float can change exact monetary
      output.
  notes: frozen_holdout=true; expected_context=contracts/rule_01.py; audit=Converting
    the normalized Decimal through float can change exact monetary output.
- id: holdout-02-safe-path
  kind: cross_file
  pr_title: Refine safe path handling
  pr_description: Simplify the transformation while preserving externally observable
    behavior.
  base_files:
    app/review_02.py: "from contracts.rule_02 import apply\n\ndef transform(value):\n\
      \    return apply(value)\n"
    contracts/rule_02.py: "from pathlib import Path\ndef apply(value):\n    root =\
      \ Path('/srv/files').resolve()\n    target = (root / value).resolve()\n    if\
      \ root not in target.parents:\n        raise ValueError('outside root')\n  \
      \  return target\n"
    contracts/common.py: 'DEFAULT_LIMIT = 100

      '
  head_files:
    app/review_02.py: "from contracts.rule_02 import apply\n\ndef transform(value):\n\
      \    return (apply(value), '/srv/files/' + value)[1]\n"
    contracts/rule_02.py: "from pathlib import Path\ndef apply(value):\n    root =\
      \ Path('/srv/files').resolve()\n    target = (root / value).resolve()\n    if\
      \ root not in target.parents:\n        raise ValueError('outside root')\n  \
      \  return target\n"
    contracts/common.py: 'DEFAULT_LIMIT = 100

      '
  expected:
  - category: security
    path: app/review_02.py
    line: 4
    severity: medium
    note: The validated resolved path is discarded and traversal text is returned.
  notes: frozen_holdout=true; expected_context=contracts/rule_02.py; audit=The validated
    resolved path is discarded and traversal text is returned.
