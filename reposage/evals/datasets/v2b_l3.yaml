# V2-B 最小 L3 检索标注（程序命中，不含密钥明文）。
name: v2b-l3
samples:
  - id: l3-import
    expected_symbols: [helper]
    head_files:
      src/app.py: |
        from src.util import helper
        def run(xs):
            for x in xs:
                helper(x)
      src/util.py: |
        def helper(x):
            return x
    diff: |
      diff --git a/src/app.py b/src/app.py
      --- a/src/app.py
      +++ b/src/app.py
      @@ -1,3 +1,4 @@
       from src.util import helper
       def run(xs):
           for x in xs:
      +        helper(x)
  - id: l3-comment
    expected_symbols: []
    forbidden_symbols: [eval]
    head_files:
      src/a.py: |
        def f():
            return 1
            # never call eval(user)
            x = 2
    diff: |
      diff --git a/src/a.py b/src/a.py
      --- a/src/a.py
      +++ b/src/a.py
      @@ -1,3 +1,4 @@
       def f():
           return 1
      +    # never call eval(user)
           x = 2
  - id: l3-docstring
    expected_symbols: []
    forbidden_symbols: [eval]
    head_files:
      src/doc.py: |
        def f():
            """docs
            never call eval(user)
            """
            return 1
    diff: |
      diff --git a/src/doc.py b/src/doc.py
      --- a/src/doc.py
      +++ b/src/doc.py
      @@ -1,4 +1,5 @@
       def f():
           """docs
      +    never call eval(user)
           """
           return 1
  - id: l3-conflict
    expected_symbols: [run]
    head_files:
      src/app.py: |
        def run():
            a = 1
            b = 2
            return 3
      src/a.py: |
        def run():
            return 0
      src/b.py: |
        def run():
            return 1
    diff: |
      diff --git a/src/app.py b/src/app.py
      --- a/src/app.py
      +++ b/src/app.py
      @@ -1,3 +1,4 @@
       def run():
           a = 1
           b = 2
      +    return 3
  - id: l3-syntax
    expected_symbols: [ok]
    head_files:
      src/broken.py: |
        def ok():
            a = 1
            b = 2
            c = 3
            return 1

        def broken(
    diff: |
      diff --git a/src/broken.py b/src/broken.py
      --- a/src/broken.py
      +++ b/src/broken.py
      @@ -3,2 +3,3 @@
           b = 2
      +    c = 3
           return 1
  - id: l3-go
    language: go
    expected_symbols: []
    forbidden_symbols: [F]
    head_files:
      src/a.go: |
        package main
        func F() {}
    diff: |
      diff --git a/src/a.go b/src/a.go
      --- a/src/a.go
      +++ b/src/a.go
      @@ -1,1 +1,2 @@
       package main
      +func F() {}
  - id: l3-test
    expected_symbols: [helper]
    head_files:
      src/app.py: |
        from src.util import helper
        def run():
            helper(1)
      src/util.py: |
        def helper(x):
            return x
      tests/test_helper.py: |
        from src.util import helper
        def test_helper():
            assert helper(1) == 1
    diff: |
      diff --git a/src/app.py b/src/app.py
      --- a/src/app.py
      +++ b/src/app.py
      @@ -1,2 +1,3 @@
       from src.util import helper
       def run():
      +    helper(1)
  - id: l3-nested
    expected_symbols: [f]
    head_files:
      src/nest.py: |
        def f(xs):
            preamble = 1
            for x in xs:
                for y in x:
                    use(y)
            return preamble
    diff: |
      diff --git a/src/nest.py b/src/nest.py
      --- a/src/nest.py
      +++ b/src/nest.py
      @@ -2,3 +2,4 @@
           preamble = 1
           for x in xs:
      +        for y in x:
               use(y)
  - id: l3-relative
    expected_symbols: [Foo]
    head_files:
      src/pkg/app.py: |
        from .mod import Foo
        def run():
            return Foo()
      src/pkg/mod.py: |
        class Foo:
            pass
    diff: |
      diff --git a/src/pkg/app.py b/src/pkg/app.py
      --- a/src/pkg/app.py
      +++ b/src/pkg/app.py
      @@ -1,2 +1,3 @@
       from .mod import Foo
       def run():
      +    return Foo()
  - id: l3-top-def
    expected_symbols: []
    forbidden_symbols: []
    head_files:
      src/top.py: |
        x = 1
        def new_fn():
            return 2
    diff: |
      diff --git a/src/top.py b/src/top.py
      --- a/src/top.py
      +++ b/src/top.py
      @@ -1,1 +1,3 @@
       x = 1
      +def new_fn():
      +    return 2
  - id: l3-helper-same-file
    expected_symbols: []
    forbidden_symbols: []
    head_files:
      src/same.py: |
        def helper(x):
            return x
        def run(xs):
            for x in xs:
                helper(x)
    diff: |
      diff --git a/src/same.py b/src/same.py
      --- a/src/same.py
      +++ b/src/same.py
      @@ -1,4 +1,5 @@
       def helper(x):
           return x
       def run(xs):
           for x in xs:
      +        helper(x)
  - id: l3-empty-py
    expected_symbols: []
    forbidden_symbols: [missing]
    head_files:
      src/ok.py: |
        def f(x):
            return x + 1
    diff: |
      diff --git a/src/ok.py b/src/ok.py
      --- a/src/ok.py
      +++ b/src/ok.py
      @@ -1,1 +1,2 @@
       def f(x):
      +    return x + 1
  - id: l3-alias
    expected_symbols: [helper]
    head_files:
      src/app.py: |
        import src.util as u
        def run():
            return u.helper(1)
      src/util.py: |
        def helper(x):
            return x
    diff: |
      diff --git a/src/app.py b/src/app.py
      --- a/src/app.py
      +++ b/src/app.py
      @@ -1,2 +1,3 @@
       import src.util as u
       def run():
      +    return u.helper(1)
  - id: l3-toplevel
    expected_symbols: [helper]
    head_files:
      src/app.py: |
        from src.util import helper
        x = 1
        helper(x)
      src/util.py: |
        def helper(x):
            return x
    diff: |
      diff --git a/src/app.py b/src/app.py
      --- a/src/app.py
      +++ b/src/app.py
      @@ -1,2 +1,3 @@
       from src.util import helper
       x = 1
      +helper(x)
  - id: l3-star
    expected_symbols: []
    forbidden_symbols: [helper]
    head_files:
      src/app.py: |
        from src.util import *
        def run():
            return helper(1)
      src/util.py: |
        def helper(x):
            return x
    diff: |
      diff --git a/src/app.py b/src/app.py
      --- a/src/app.py
      +++ b/src/app.py
      @@ -1,2 +1,3 @@
       from src.util import *
       def run():
      +    return helper(1)
  - id: l3-unused-import
    expected_symbols: [helper]
    forbidden_symbols: [unused]
    head_files:
      src/app.py: |
        from src.util import helper, unused
        def run():
            return helper(1)
      src/util.py: |
        def helper(x):
            return x
        def unused(x):
            return x
    diff: |
      diff --git a/src/app.py b/src/app.py
      --- a/src/app.py
      +++ b/src/app.py
      @@ -1,2 +1,3 @@
       from src.util import helper, unused
       def run():
      +    return helper(1)
