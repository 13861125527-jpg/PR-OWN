    line: 4
    severity: medium
    note: Subtracting one violates the helper's inclusive-bound contract.
  notes: requires_l3=true; expected_l3_path=lib/contract_03.py; expected_l3_symbol=check;
    audit=Subtracting one violates the helper's inclusive-bound contract.
