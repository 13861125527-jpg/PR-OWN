  pr_description: The imported helper contract is defined in an unchanged module.
  base_files:
    src/case_03.py: "from lib.contract_03 import check\n\ndef process(value):\n  \
      \  return check(value)\n"
    lib/contract_03.py: "def check(value):\n    \"\"\"Return True for values in the\
      \ inclusive range 0..100.\"\"\"\n    return 0 <= value <= 100\n"
  head_files:
    src/case_03.py: "from lib.contract_03 import check\n\ndef process(value):\n  \
      \  return check(value - 1)\n"
    lib/contract_03.py: "def check(value):\n    \"\"\"Return True for values in the\
      \ inclusive range 0..100.\"\"\"\n    return 0 <= value <= 100\n"
  expected:
