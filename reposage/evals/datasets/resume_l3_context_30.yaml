name: resume-l3-context-30
samples:
- id: l3-01-none-sentinel
  kind: cross_file
  pr_title: none sentinel
  pr_description: The imported helper contract is defined in an unchanged module.
  base_files:
    src/case_01.py: "from lib.contract_01 import check\n\ndef process(value):\n  \
      \  return check(value) is None\n"
    lib/contract_01.py: "def check(value):\n    \"\"\"Return None when value is absent;\
      \ zero is a valid result.\"\"\"\n    return None if value is None else value\n"
  head_files:
    src/case_01.py: "from lib.contract_01 import check\n\ndef process(value):\n  \
      \  return not check(value)\n"
    lib/contract_01.py: "def check(value):\n    \"\"\"Return None when value is absent;\
      \ zero is a valid result.\"\"\"\n    return None if value is None else value\n"
  expected:
  - category: correctness
    path: src/case_01.py
    line: 4
    severity: medium
    note: Falsy zero is confused with the documented None sentinel.
  notes: requires_l3=true; expected_l3_path=lib/contract_01.py; expected_l3_symbol=check;
    audit=Falsy zero is confused with the documented None sentinel.
