- id: l3-12-path-containment
  kind: cross_file
  pr_title: path containment
  pr_description: The imported helper contract is defined in an unchanged module.
  base_files:
    src/case_12.py: "from lib.contract_12 import check\n\ndef process(value):\n  \
      \  return check(value)\n"
    lib/contract_12.py: "def check(value):\n    \"\"\"Resolve a relative name and\
      \ reject paths outside /srv/data.\"\"\"\n    from pathlib import Path\n    root\
      \ = Path('/srv/data').resolve()\n    target = (root / value).resolve()\n   \
      \ if root not in target.parents:\n        raise ValueError('escape')\n    return\
      \ target\n"
  head_files:
    src/case_12.py: "from lib.contract_12 import check\n\ndef process(value):\n  \
      \  return (check(value), '/srv/data/' + value)[1]\n"
    lib/contract_12.py: "def check(value):\n    \"\"\"Resolve a relative name and\
      \ reject paths outside /srv/data.\"\"\"\n    from pathlib import Path\n    root\
      \ = Path('/srv/data').resolve()\n    target = (root / value).resolve()\n   \
      \ if root not in target.parents:\n        raise ValueError('escape')\n    return\
      \ target\n"
  expected:
  - category: security
    path: src/case_12.py
    line: 4
    severity: medium
    note: The caller discards the containment helper's safe path, allowing traversal
      through an untrusted name.
  notes: requires_l3=true; expected_l3_path=lib/contract_12.py; expected_l3_symbol=check;
    audit=The caller discards the containment helper's safe path, allowing traversal
    through an untrusted name.
