  head_files:
    src/downloads.py: "from pathlib import Path\nROOT = Path('/srv/reports')\ndef load(name):\n    return (ROOT / name).read_bytes()\n"
  expected:
  - category: security
    path: src/downloads.py
    line: 4
    severity: high
    note: Untrusted name can escape ROOT through ../; confirm containment after resolution.
  notes: single-file; path containment
