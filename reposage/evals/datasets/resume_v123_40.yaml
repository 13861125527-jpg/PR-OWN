# Synthetic benchmark for an initial V1/V2/V3 comparison.
# Gold labels require human review before results are used in a resume.
# Generated by reposage/evals/generate_resume_dataset.py.
name: resume-v123-synthetic-40
samples:
- id: r01-sql-injection
  kind: single_defect
  pr_title: support user lookup
  pr_description: ''
  base_files:
    src/users.py: "def find(cur, name):\n    return cur.execute('SELECT * FROM users WHERE name=?', (name,))\n"
  head_files:
    src/users.py: "def find(cur, name):\n    return cur.execute(f\"SELECT * FROM users WHERE name='{name}'\")\n"
  expected:
  - category: security
    path: src/users.py
    line: 2
    severity: high
    note: User-controlled name is interpolated into SQL; verify parameterization restores safety.
  notes: single-file; explicit attacker-controlled input; audit_priority=high
