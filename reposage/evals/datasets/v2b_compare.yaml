# V2-B 对照集：必须含跨文件 L3；Finding 为脚本化 Fake，不代表模型增益。
name: v2b-compare
samples:
  - id: v2b-cross-eval
    kind: single_defect
    pr_title: "call helper and eval"
    base_files:
      src/app.py: |
        from src.util import helper
        def run(x):
            return x
      src/util.py: |
        def helper(x):
            return x
    head_files:
      src/app.py: |
        from src.util import helper
        def run(x):
            helper(x)
            return eval(x)
      src/util.py: |
        def helper(x):
            return x
    expected:
      - category: security
        path: src/app.py
        line: 4
  - id: v2b-consume
    kind: single_defect
    pr_title: "consume l3 helper"
    base_files:
      src/app.py: |
        from src.util import helper
        def run(x):
            return x
      src/util.py: |
        def helper(x):
            return x
    head_files:
      src/app.py: |
        from src.util import helper
        def run(x):
            return helper(x)
      src/util.py: |
        def helper(x):
            return x
    expected:
      - category: correctness
        path: src/app.py
        line: 3
  - id: v2b-alias
    kind: single_defect
    pr_title: "alias import"
    base_files:
      src/app.py: |
        import src.util as u
        def run(x):
            return x
      src/util.py: |
        def helper(x):
            return x
    head_files:
      src/app.py: |
        import src.util as u
        def run(x):
            return u.helper(x)
      src/util.py: |
        def helper(x):
            return x
    expected:
      - category: correctness
        path: src/app.py
        line: 3
  - id: v2b-relative
    kind: single_defect
    pr_title: "relative import"
    base_files:
      src/pkg/app.py: |
        from .mod import Foo
        def run():
            return 1
      src/pkg/mod.py: |
        class Foo:
            pass
    head_files:
      src/pkg/app.py: |
        from .mod import Foo
        def run():
            return Foo()
      src/pkg/mod.py: |
        class Foo:
            pass
    expected:
      - category: correctness
        path: src/pkg/app.py
        line: 3
