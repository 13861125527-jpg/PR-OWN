name: RepoSage PR Review

"on":
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: reposage-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PR_NUMBER: ${{ github.event.pull_request.number }}
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      MODEL_API_KEY: ${{ secrets.MODEL_API_KEY }}
      MODEL_BASE_URL: ${{ vars.MODEL_BASE_URL || 'https://api.deepseek.com' }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      # pull_request_target intentionally runs the trusted default-branch workflow.
      # The untrusted PR head is fetched only as a Git object and is never executed.
      - name: Checkout trusted RepoSage code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch PR snapshots without checking out PR code
        shell: bash
        run: |
          git fetch --no-tags origin "$BASE_SHA"
          git fetch --no-tags origin "+refs/pull/$PR_NUMBER/head:refs/remotes/reposage/pr-$PR_NUMBER"
          test "$(git rev-parse refs/remotes/reposage/pr-$PR_NUMBER)" = "$HEAD_SHA"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install trusted reviewer
        run: python -m pip install .

      - name: Review and publish
        run: >-
          reposage review
          --repo .
          --pr "$PR_NUMBER"
          --strategy agentic
          --publish
          --output reposage-review.json

      - name: Upload review evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reposage-review-${{ github.event.pull_request.number }}-${{ github.run_id }}
          path: |
            reposage-review.json
            .reposage/reposage.db
          if-no-files-found: ignore
          retention-days: 14
